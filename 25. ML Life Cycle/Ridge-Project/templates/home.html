<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FWI Prediction</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: #1f2933;
        background: linear-gradient(
          135deg,
          #f7c66b 0%,
          #e7683f 45%,
          #284b63 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }

      .login {
        width: min(920px, 100%);
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 22px 60px rgba(31, 41, 51, 0.24);
        padding: 32px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        color: #102a43;
        text-align: center;
      }

      .subtitle {
        margin: 0 0 28px;
        color: #52606d;
        text-align: center;
        line-height: 1.5;
      }

      form {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 14px;
        font-weight: 700;
        color: #334e68;
      }

      input,
      select {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 12px 14px;
        font-size: 15px;
        color: #102a43;
        background: #f8fafc;
        outline: none;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      input:focus,
      select:focus {
        border-color: #e7683f;
        box-shadow: 0 0 0 3px rgba(231, 104, 63, 0.18);
      }

      .actions {
        grid-column: 1 / -1;
        display: flex;
        justify-content: center;
        margin-top: 8px;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: #d94f30;
        color: #ffffff;
        cursor: pointer;
        font-size: 16px;
        font-weight: 700;
        padding: 13px 28px;
        min-width: 190px;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      button:hover {
        background: #b83c22;
        transform: translateY(-1px);
      }

      .result {
        margin-top: 26px;
        padding: 18px;
        border-radius: 8px;
        background: #e8f6ef;
        color: #1b4332;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
      }

      @media (max-width: 760px) {
        .login {
          padding: 24px;
        }

        form {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <main class="login">
      <h1>FWI Prediction</h1>
      <p class="subtitle">
        Enter Algerian forest fire weather values to predict the Fire Weather
        Index.
      </p>

      <form action="{{ url_for('predict_datapoint') }}" method="post">
        <div class="form-group">
          <label for="Temperature">Temperature</label>
          <input
            id="Temperature"
            name="Temperature"
            type="number"
            step="any"
            placeholder="Example: 29"
            required
          />
        </div>

        <div class="form-group">
          <label for="RH">Relative Humidity</label>
          <input
            id="RH"
            name="RH"
            type="number"
            step="any"
            placeholder="Example: 57"
            required
          />
        </div>

        <div class="form-group">
          <label for="Ws">Wind Speed</label>
          <input
            id="Ws"
            name="Ws"
            type="number"
            step="any"
            placeholder="Example: 18"
            required
          />
        </div>

        <div class="form-group">
          <label for="Rain">Rain</label>
          <input
            id="Rain"
            name="Rain"
            type="number"
            step="any"
            placeholder="Example: 0.0"
            required
          />
        </div>

        <div class="form-group">
          <label for="FFMC">FFMC</label>
          <input
            id="FFMC"
            name="FFMC"
            type="number"
            step="any"
            placeholder="Example: 65.7"
            required
          />
        </div>

        <div class="form-group">
          <label for="DMC">DMC</label>
          <input
            id="DMC"
            name="DMC"
            type="number"
            step="any"
            placeholder="Example: 3.4"
            required
          />
        </div>

        <div class="form-group">
          <label for="ISI">ISI</label>
          <input
            id="ISI"
            name="ISI"
            type="number"
            step="any"
            placeholder="Example: 1.3"
            required
          />
        </div>

        <div class="form-group">
          <label for="Classes">Fire Class</label>
          <select id="Classes" name="Classes" required>
            <option value="" disabled selected>Select class</option>
            <option value="0">Not fire</option>
            <option value="1">Fire</option>
          </select>
        </div>

        <div class="form-group">
          <label for="Region">Region</label>
          <select id="Region" name="Region" required>
            <option value="" disabled selected>Select region</option>
            <option value="0">Bejaia</option>
            <option value="1">Sidi Bel-Abbes</option>
          </select>
        </div>

        <div class="actions">
          <button type="submit">Predict FWI</button>
        </div>
      </form>

      {% if result is defined %}
      <div class="result">Predicted FWI: {{ "%.2f"|format(result) }}</div>
      {% endif %}
    </main>
  </body>
</html>
