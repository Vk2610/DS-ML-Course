<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact Us</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background: white;
        padding: 30px 40px;
        border-radius: 10px;
        width: 350px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      label {
        font-weight: bold;
        font-size: 14px;
      }

      input[type='text'],
      input[type='email'],
      textarea {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        margin-bottom: 15px;
        border-radius: 5px;
        border: 1px solid #ccc;
        font-size: 14px;
      }

      textarea {
        resize: none;
      }

      input[type='submit'] {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 5px;
        background-color: #667eea;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      input[type='submit']:hover {
        background-color: #5a67d8;
      }

      .footer {
        text-align: center;
        margin-top: 10px;
        font-size: 12px;
        color: #777;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Contact Us</h2>

      <form action="/contact" method="POST">
        <label for="name">Name:</label>
        <input type="text" name="name" required />

        <label for="email">Email:</label>
        <input type="email" name="email" required />

        <label for="message">Message:</label>
        <textarea name="message" rows="5" required></textarea>

        <input type="submit" value="Submit" />
      </form>

      <div class="footer">Flask Contact Form Demo</div>
    </div>
  </body>
</html>
