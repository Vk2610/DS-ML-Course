<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flask Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
        text-align: center;
        margin-top: 100px;
      }
      h1 {
        color: #2c3e50;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #2980b9;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to Flask Demo 🚀</h1>
    <p>{{ message }}</p>

    <form action="/greet" method="POST">
      <input
        type="text"
        name="username"
        placeholder="Enter your name"
        required
      />
      <br /><br />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
